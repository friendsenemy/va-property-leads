name: Monthly delinquency walk

# Treasurer's Real Estate Public Inquiry: one request per parcel, then a 1.5 s
# pause. The county (14,435 parcels) takes 11 to 18 hours, so it runs over the
# first six nights of each month. Every night takes the parcels not checked in the
# last 20 days, oldest first, for up to 5 h 20 min. Nothing depends on a given
# night: a missed or short night is made up by the next one, and once every parcel
# is fresh the remaining nights finish in a minute.
#
# No manual step is needed. The "Run workflow" button is only there if you want
# fresh balances on your current leads mid-month (mode: priority, about an hour).

on:
  schedule:
    - cron: '30 4 1-6 * *'    # 04:30 UTC = 12:30 AM EDT, nights 1-6
  workflow_dispatch:
    inputs:
      mode:
        description: 'priority (parcels on a board, ~1 hour) or all (whole county, resumes)'
        default: 'priority'
  push:
    branches: [main]
    paths: ['.github/workflows/monthly-delinquency.yml']

# The walk keeps going until the county is done: when a run ends with parcels still
# unchecked it starts the next run itself. It stops chaining once every parcel has
# been checked in the last 20 days, or if a run made no progress (site down); the
# monthly schedule then picks it up again.

permissions:
  contents: write
  actions: write

concurrency:
  group: delinquency-walk
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Pull parcels into SQLite
        run: python -m engine.parcels
      - name: Build the boards (so the priority list is current)
        run: python -m engine.build_board --no-fetch
      - name: Walk
        id: walk
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ github.event.inputs.mode }}" = "all" ]; then
            python -m engine.delinquency --mode all --budget-minutes 320
          else
            python -m engine.delinquency --mode priority --budget-minutes 320
          fi
      - name: Rebuild the boards with the new balances
        run: python -m engine.build_board --no-fetch
      - name: Commit results
        if: always()
        run: |
          N=$(python -c "import json;print(json.load(open('data/delinquency/leads.json'))['summary']['leads'])")
          .github/commit-data.sh "Delinquency walk: ${N} delinquent owners" \
            data/delinquency/balances.json data/delinquency/state.json
      - name: Keep going until the county is done
        # Only after a walk that finished cleanly. A failed walk never starts another one.
        if: success() && steps.walk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read REMAINING TODAY <<< "$(python - <<'PY'
          import datetime as dt, json, sqlite3
          state = json.load(open("data/delinquency/state.json"))["checked"]
          n = sqlite3.connect(".cache/kg.sqlite").execute("select count(*) from parcels").fetchone()[0]
          today = dt.date.today()
          cutoff = (today - dt.timedelta(days=20)).isoformat()
          fresh = sum(1 for v in state.values() if v >= cutoff)
          print(n - fresh, open(".cache/walk-done.txt").read().strip() or 0)
          PY
          )"
          echo "parcels still to check: $REMAINING; checked in this run: $TODAY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "all" ]; then exit 0; fi
          if [ "$REMAINING" -gt 0 ] && [ "$TODAY" -ge 50 ]; then
            gh workflow run monthly-delinquency.yml --repo "${{ github.repository }}" --ref main -f mode=all
            echo "started the next run"
          fi
