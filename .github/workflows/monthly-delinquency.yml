name: Monthly delinquency walk

# Treasurer's Real Estate Public Inquiry: one request per parcel, then a 1.5 s
# pause. The county (14,435 parcels) takes 11 to 18 hours, so it runs over the
# first six nights of each month. Every night takes the parcels not checked in the
# last 20 days, oldest first, for up to 5 h 20 min. Nothing depends on a given
# night: a missed or short night is made up by the next one, and once every parcel
# is fresh the remaining nights finish in a minute.
#
# No manual step is needed. The "Run workflow" button is only there if you want
# fresh balances on your current leads mid-month (mode: priority, about an hour).

on:
  schedule:
    - cron: '30 4 1-6 * *'    # 04:30 UTC = 12:30 AM EDT, nights 1-6
  workflow_dispatch:
    inputs:
      mode:
        description: 'priority (parcels on a board, ~1 hour) or all (whole county, resumes)'
        default: 'priority'

permissions:
  contents: write

concurrency:
  group: data-writers
  cancel-in-progress: false

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Pull parcels into SQLite
        run: python -m engine.parcels
      - name: Build the boards (so the priority list is current)
        run: python -m engine.build_board --no-fetch
      - name: Walk
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "all" ]; then
            python -m engine.delinquency --mode all --budget-minutes 320
          else
            python -m engine.delinquency --mode priority --budget-minutes 320
          fi
      - name: Rebuild the boards with the new balances
        run: python -m engine.build_board --no-fetch
      - name: Commit results
        if: always()
        run: |
          N=$(python -c "import json;print(json.load(open('data/delinquency/leads.json'))['summary']['leads'])")
          .github/commit-data.sh "Delinquency walk: ${N} delinquent owners" \
            data/delinquency/balances.json data/delinquency/state.json
